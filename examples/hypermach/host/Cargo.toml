[package]
name = "hypermach-host"
version = "0.1.0"
edition = "2024"
author = ["vjabrayilov"]

[dependencies]
anyhow = "1.0.93"
log = "0.4.22"
serde = { version = "1.0.217", features = ["std", "derive"] }
serde_json = { version = "1.0.134", features = ["std"] }

#hyperlight-guest = { git = "https://github.com/hyperlight-dev/hyperlight/", tag = "v0.4.0", package = "hyperlight-guest" }
hyperlight-host = { git = "https://github.com/hyperlight-dev/hyperlight/", tag = "v0.4.0", default-features = false, features = ["kvm"] }
hyperlight-common = {git = "https://github.com/hyperlight-dev/hyperlight/", tag = "v0.4.0", default-features = false, package = "hyperlight-common" }
rand = "0.8.5"
hdrhistogram = "7.5"
num_cpus = "1.16"
core_affinity = "0.8"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
machnet = "0.1.8"
env_logger = "0.11.8"
